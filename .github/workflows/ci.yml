name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q

  truthcheck:
    name: Truth pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run truthcheck
        run: sh scripts/truthcheck.sh
